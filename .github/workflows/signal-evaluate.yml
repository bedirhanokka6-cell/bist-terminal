name: Sinyal Sonuclarini Otomatik Degerlendir

on:
  schedule:
    # Türkiye saatiyle hafta içi yaklaşık 18:35 (UTC 15:35)
    - cron: '35 15 * * 1-5'
  workflow_dispatch:

jobs:
  evaluate-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Render backend'i uyandir
        run: |
          curl --fail --retry 5 --retry-delay 15 --max-time 120             https://bist-terminal-api.onrender.com/health

      - name: 1 gunluk sinyalleri degerlendir
        run: |
          curl --fail --retry 3 --retry-delay 10 --max-time 120             -X POST "https://bist-terminal-api.onrender.com/api/signals/evaluate-pending/all?horizon_days=1&limit=200"

      - name: 3 gunluk sinyalleri degerlendir
        run: |
          curl --fail --retry 3 --retry-delay 10 --max-time 120             -X POST "https://bist-terminal-api.onrender.com/api/signals/evaluate-pending/all?horizon_days=3&limit=200"

      - name: 5 gunluk sinyalleri degerlendir
        run: |
          curl --fail --retry 3 --retry-delay 10 --max-time 120             -X POST "https://bist-terminal-api.onrender.com/api/signals/evaluate-pending/all?horizon_days=5&limit=200"

      - name: 10 gunluk sinyalleri degerlendir
        run: |
          curl --fail --retry 3 --retry-delay 10 --max-time 120             -X POST "https://bist-terminal-api.onrender.com/api/signals/evaluate-pending/all?horizon_days=10&limit=200"
